# Database migrations. The server applies them automatically at startup (app/data/db.py).
# Use the CLI only to create a new migration after changing app/data/models.py:
#   .venv/bin/alembic revision --autogenerate -m "describe the change"
# The database URL comes from the app settings (INHIBITAI_DATABASE_URL / backend/.env).
[alembic]
script_location = app/data/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s: %(message)s
